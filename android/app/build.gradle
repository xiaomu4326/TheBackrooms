plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

def buildPythonPath = System.getenv("BUILD_PYTHON") ?: "python3"

android {
    namespace 'com.xiaomu.backrooms'
    compileSdk 34

    defaultConfig {
        applicationId "com.xiaomu.backrooms"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        ndk {
            // Python 3.12+ 只支持 64 位 ABI
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    signingConfigs {
        release {
            def propsFile = rootProject.file("keystore.properties")
            if (propsFile.exists()) {
                def props = new Properties()
                props.load(new FileInputStream(propsFile))
                storeFile rootProject.file(props.storeFile)
                storePassword props.storePassword
                keyAlias props.keyAlias
                keyPassword props.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (rootProject.file("keystore.properties").exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

chaquopy {
    defaultConfig {
        version = "3.12"
        buildPython = [buildPythonPath]
    }
    sourceSets {
        getByName("main") {
            srcDirs = ["src/main/python", "build/python-src"]
        }
    }
}

def syncPython = tasks.register("syncPython", Copy) {
    from("../../backrooms") {
        include "*.py"
    }
    into(layout.buildDirectory.dir("python-src/backrooms"))
}
tasks.named("preBuild").configure { dependsOn(syncPython) }
tasks.matching { it.name.startsWith("merge") && it.name.endsWith("PythonSources") }
        .configureEach { dependsOn(syncPython) }
